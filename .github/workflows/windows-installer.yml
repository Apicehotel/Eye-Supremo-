name: Eye Supremo Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feat/eye-supremo-foundations]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'installer/**'
      - 'scripts/build_windows.ps1'
      - 'scarica-modelli-ia.bat'
      - '.github/workflows/windows-installer.yml'

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build portable executable
        shell: powershell
        run: ./scripts/build_windows.ps1
      - name: Smoke test packaged executable
        shell: powershell
        run: |
          $env:EYE_SUPREMO_NO_BROWSER = '1'
          $proc = Start-Process -FilePath "$PWD\dist\EyeSupremo.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
              $log = Join-Path $env:LOCALAPPDATA 'EyeSupremo\logs\launcher.log'
              if (Test-Path $log) { Get-Content $log }
              throw 'EyeSupremo.exe non ha risposto su http://127.0.0.1:8765/'
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Install Inno Setup if missing
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
      - name: Compile setup
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\EyeSupremo.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: EyeSupremo-Windows-Setup
          path: release/EyeSupremo-Setup.exe
          if-no-files-found: error
