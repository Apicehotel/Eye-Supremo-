name: Eye Supremo Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'ask-fatture/**'
      - 'installer/**'
      - 'scripts/build_windows.ps1'
      - 'scripts/build_ask_fatture.ps1'
      - 'scarica-modelli-ia.bat'
      - '.github/workflows/windows-installer.yml'

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Eye Supremo executable
        shell: powershell
        run: ./scripts/build_windows.ps1
      - name: Smoke test EyeSupremo.exe
        shell: powershell
        run: |
          $env:EYE_SUPREMO_HEADLESS = '1'
          $proc = Start-Process -FilePath "$PWD\dist\EyeSupremo.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) {
                Write-Host "EyeSupremo.exe uscita anticipata, exit=$($proc.ExitCode)"
                break
              }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
              $log = Join-Path $env:LOCALAPPDATA 'EyeSupremo\logs\launcher.log'
              if (Test-Path $log) { Get-Content $log }
              throw 'EyeSupremo.exe non ha risposto su http://127.0.0.1:8765/'
            }
            $health = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/docs' -UseBasicParsing -TimeoutSec 5
            if ($health.StatusCode -ne 200) { throw 'API fatture non raggiungibili su /api/docs' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Build Ask Fatture executable
        shell: powershell
        run: ./scripts/build_ask_fatture.ps1
      - name: Smoke test AskFatture.exe
        shell: powershell
        run: |
          $env:ASK_FATTURE_HEADLESS = '1'
          $proc = Start-Process -FilePath "$PWD\dist\AskFatture.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) {
                Write-Host "AskFatture.exe uscita anticipata, exit=$($proc.ExitCode)"
                break
              }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8787/api/health' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
              $log = Join-Path $env:LOCALAPPDATA 'AskFatture\logs\launcher.log'
              if (Test-Path $log) { Get-Content $log }
              throw 'AskFatture.exe non ha risposto su http://127.0.0.1:8787/api/health'
            }
            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8787/' -UseBasicParsing -TimeoutSec 5
            if ($page.StatusCode -ne 200) { throw 'UI Ask Fatture non raggiungibile su /' }
            if ($page.Content -notmatch 'Chili') { throw 'UI non allineata: manca tendina Chili/Litri/Pezzi' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Install Inno Setup if missing
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
      - name: Compile setups
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\EyeSupremo.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\AskFatture.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Setups
          path: |
            release/EyeSupremo-Setup.exe
            release/AskFatture-Setup.exe
          if-no-files-found: error
