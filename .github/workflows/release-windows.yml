name: Publish Eye Supremo Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione senza prefisso v, ad esempio 2.0.0'
        required: true
        type: string
  push:
    tags:
      - 'v*'
    branches: [main]
    paths: ['installer/EyeSupremo.iss']

permissions:
  contents: write

jobs:
  # Su main la release parte da sola quando cambia installer/EyeSupremo.iss (filtro `paths` sopra)
  # e la versione non è già stata pubblicata; resta possibile avviarla a mano o con `[release]`.
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] || [ "$GITHUB_REF_TYPE" = 'tag' ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          version=$(sed -n 's/^AppVersion=//p' installer/EyeSupremo.iss | head -1 | tr -d '\r ')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version già pubblicata: nessuna nuova build."; echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  release-windows:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Risolvi versione
        id: version
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION_INPUT" ]; then
            version="$RELEASE_VERSION_INPUT"
          elif [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p 'JSON.parse(require("fs").readFileSync("frontend/package.json","utf8")).version')
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Versione non valida'; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Verifica versione installer
        shell: powershell
        run: |
          $line = Select-String -Path 'installer\EyeSupremo.iss' -Pattern '^AppVersion=' | Select-Object -First 1
          if (-not $line) { throw 'AppVersion non trovato in installer\EyeSupremo.iss' }
          $installerVersion = ($line.Line -split '=', 2)[1].Trim()
          if ($installerVersion -ne '${{ steps.version.outputs.name }}') {
            throw "Versione tag ${{ steps.version.outputs.name }} diversa da AppVersion $installerVersion"
          }

      - name: Build eseguibile
        shell: powershell
        run: ./scripts/build_windows.ps1

      - name: Smoke test eseguibile
        shell: powershell
        run: |
          $env:EYE_SUPREMO_HEADLESS = '1'
          $env:EYE_SUPREMO_NO_BROWSER = '1'
          $proc = Start-Process -FilePath "$PWD\dist\EyeSupremo.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/docs' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'EyeSupremo.exe non ha risposto su /api/docs' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Compila installer
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 non disponibile' }
          & $iscc 'installer\EyeSupremo.iss'
          if (-not (Test-Path 'release\EyeSupremo-Setup-${{ steps.version.outputs.name }}.exe')) { throw 'Installer con versione nel nome non prodotto (controlla OutputBaseFilename in installer\EyeSupremo.iss)' }

      - name: Pubblica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Eye Supremo ${{ steps.version.outputs.name }}
          files: release/EyeSupremo-Setup-${{ steps.version.outputs.name }}.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

