name: Publish Eye Supremo Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione senza prefisso v, ad esempio 2.0.0'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Risolvi versione
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            raw="${GITHUB_REF_NAME}"
            echo "tag=${raw}" >> "$GITHUB_OUTPUT"
            echo "name=${raw#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifica versione installer
        shell: powershell
        run: |
          $line = Select-String -Path 'installer\EyeSupremo.iss' -Pattern '^AppVersion=' | Select-Object -First 1
          if (-not $line) { throw 'AppVersion non trovato in installer\EyeSupremo.iss' }
          $installerVersion = ($line.Line -split '=', 2)[1].Trim()
          if ($installerVersion -ne '${{ steps.version.outputs.name }}') {
            throw "Versione tag ${{ steps.version.outputs.name }} diversa da AppVersion $installerVersion"
          }

      - name: Build eseguibile
        shell: powershell
        run: ./scripts/build_windows.ps1

      - name: Smoke test eseguibile
        shell: powershell
        run: |
          $env:EYE_SUPREMO_NO_BROWSER = '1'
          $proc = Start-Process -FilePath "$PWD\dist\EyeSupremo.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { break }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/api/docs' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'EyeSupremo.exe non ha risposto su /api/docs' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Compila installer
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 non disponibile' }
          & $iscc 'installer\EyeSupremo.iss'
          if (-not (Test-Path 'release\EyeSupremo-Setup.exe')) { throw 'Installer non prodotto' }

      - name: Pubblica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Eye Supremo ${{ steps.version.outputs.name }}
          files: release/EyeSupremo-Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
