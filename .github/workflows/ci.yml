name: Eye Supremo CI

on:
  pull_request:
    branches: [main, feat/eye-supremo-foundations]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend requests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: EyeSupremo-Frontend-Dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  source-snapshot:
    needs: [backend, frontend, central-identity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload tested source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: EyeSupremo-Tested-Source
          path: |
            backend
            frontend
            installer
            scripts
            supabase
            README.md
            setup.bat
            start.bat
            scarica-modelli-ia.bat
          if-no-files-found: error
          retention-days: 7


  central-identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: eye_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check central functions
        run: deno check --node-modules-dir=auto supabase/functions/eye-identity/index.ts supabase/functions/eye-central-gateway/index.ts supabase/functions/eye-updates/index.ts
      - name: Test central identity on PostgreSQL
        env:
          EYE_IDENTITY_TEST_DB: postgresql://postgres:test-only@127.0.0.1:5432/eye_identity_test
        run: deno test -A --node-modules-dir=auto supabase/tests/identity_integration_test.ts
